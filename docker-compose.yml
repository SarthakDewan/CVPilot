# Local development stack. Copy .env.example to .env first (see README).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      ML_SHARED_SECRET: ${ML_SHARED_SECRET:?set ML_SHARED_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-in}
    # Not published to the host: only the gateway can reach it.
    expose: ["8000"]

  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      ml-service: { condition: service_started }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/cvpilot
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SHARED_SECRET: ${ML_SHARED_SECRET:?set ML_SHARED_SECRET in .env}
    ports: ["4000:4000"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [gateway]
    ports: ["8080:80"]

volumes:
  mongo-data:
